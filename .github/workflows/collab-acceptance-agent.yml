name: collab-acceptance-agent

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Target PR number"
        required: true
        type: string
      acceptance_request_id:
        description: "Acceptance Request ID"
        required: false
        default: ""
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: collab-acceptance-agent-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: [self-hosted, macOS, workbuddy]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '[验收委托 / ACCEPTANCE_REQUEST]')
      )
    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pr_number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
            echo "acceptance_request_id=${{ inputs.acceptance_request_id }}" >> "$GITHUB_OUTPUT"
          else
            python3 github-actions/resolve_acceptance_inputs.py
          fi

      - name: Resolve acceptance request body
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.inputs.outputs.pr_number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REQUEST_ID: ${{ steps.inputs.outputs.acceptance_request_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          output_path = os.environ["GITHUB_OUTPUT"]
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          request_id = os.environ.get("REQUEST_ID", "").strip()

          def write_output(name: str, value: str) -> None:
            with open(output_path, "a", encoding="utf-8") as fh:
              fh.write(f"{name}<<__EOF__\n{value}\n__EOF__\n")

          comment_body = os.environ.get("COMMENT_BODY", "")
          if event_name == "issue_comment":
            write_output("comment_body", comment_body)
            sys.exit(0)

          pr_number = os.environ["PR_NUMBER"]
          result = subprocess.run(
            [
              "gh",
              "pr",
              "view",
              pr_number,
              "--json",
              "comments",
            ],
            check=True,
            capture_output=True,
            text=True,
          )
          payload = json.loads(result.stdout)
          comments = [comment.get("body", "") for comment in payload.get("comments", [])]
          candidates = [
            body for body in comments if "[验收委托 / ACCEPTANCE_REQUEST]" in body
          ]

          if request_id:
            filtered = []
            for body in candidates:
              match = re.search(r"Acceptance Request ID:\s*(.+)", body)
              if match and match.group(1).strip() == request_id:
                filtered.append(body)
            if filtered:
              candidates = filtered

          write_output("comment_body", candidates[-1] if candidates else "")
          PY

      - name: Create or load acceptance cycle
        id: cycle
        env:
          PR_NUMBER: ${{ steps.inputs.outputs.pr_number }}
          ACCEPTANCE_REQUEST_ID: ${{ steps.inputs.outputs.acceptance_request_id }}
          COMMENT_BODY: ${{ steps.request.outputs.comment_body }}
        run: |
          python3 github-actions/manage_acceptance_cycle.py > acceptance_cycle.json

      - name: Mint lark tenant access token
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = json.dumps(
              {
                  "app_id": os.environ["LARK_APP_ID"],
                  "app_secret": os.environ["LARK_APP_SECRET"],
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              result = json.loads(response.read().decode("utf-8"))
          if result.get("code") != 0 or not result.get("tenant_access_token"):
              raise SystemExit(json.dumps(result, ensure_ascii=False))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"LARK_TENANT_ACCESS_TOKEN={result['tenant_access_token']}\n")
          PY

      - name: Collect lark context
        env:
          LARK_IDENTITY: bot
          LARKSUITE_CLI_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARKSUITE_CLI_TENANT_ACCESS_TOKEN: ${{ env.LARK_TENANT_ACCESS_TOKEN }}
          LARKSUITE_CLI_STRICT_MODE: off
        run: |
          python3 github-actions/collect_lark_context.py acceptance_cycle.json > acceptance_context.json

      - name: Run acceptance cycle
        env:
          LARK_IDENTITY: bot
          LARKSUITE_CLI_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARKSUITE_CLI_TENANT_ACCESS_TOKEN: ${{ env.LARK_TENANT_ACCESS_TOKEN }}
          LARKSUITE_CLI_STRICT_MODE: off
          COMMENT_BODY: ${{ steps.request.outputs.comment_body }}
          PR_NUMBER: ${{ steps.inputs.outputs.pr_number }}
        run: |
          python3 github-actions/run_acceptance_cycle.py acceptance_cycle.json > acceptance_run.json

      - name: Render VALIDATION_RESULT comment
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("acceptance_run.json").read_text(encoding="utf-8"))
          Path("pr_acceptance_result.md").write_text(
            payload["comment_body"],
            encoding="utf-8",
          )
          Path("lark_summary_patch.json").write_text(
            json.dumps(payload["lark_summary_patch"], ensure_ascii=False, indent=2),
            encoding="utf-8",
          )
          PY

      - name: Post VALIDATION_RESULT comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.inputs.outputs.pr_number }}
        run: gh pr comment "${PR_NUMBER}" --body-file pr_acceptance_result.md
