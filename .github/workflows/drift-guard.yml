name: drift-guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      change_class:
        required: true
        type: choice
        options: [mainline, integration, infra]
        default: mainline
  schedule:
    - cron: "10 */4 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

concurrency:
  group: drift-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: [self-hosted, macOS, workbuddy]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure clean workspace
        shell: bash
        run: |
          set -e
          git reset --hard
          git clean -fdx
          git fetch origin main --depth=1

      - name: Run drift guard
        id: drift
        uses: ./.github/actions/drift-guard
        with:
          mode: ${{ github.event_name }}
          change_class: ${{ inputs.change_class || 'mainline' }}
          config_path: .workbuddy/drift-guard.json
          base_sha: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
          head_sha: ${{ github.event_name == 'pull_request' && 'HEAD' || '' }}
          report_json: drift_report.json
          report_md: drift_report.md

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-guard-report-${{ github.run_id }}
          path: |
            drift_report.json
            drift_report.md

      - name: Cleanup runner workspace
        if: always()
        shell: bash
        run: |
          git reset --hard || true
          git clean -fdx || true
