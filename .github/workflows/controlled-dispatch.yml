name: controlled-dispatch

on:
  workflow_dispatch:
    inputs:
      change_class:
        required: true
        type: choice
        options: [mainline, integration, infra]
        default: mainline
      trigger_target:
        required: true
        type: choice
        options:
          - real-approval-trigger
          - knowledge-materialization
          - approval-polling-writeback
        default: knowledge-materialization
      trigger_inputs_json:
        required: false
        default: "{}"
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  gate:
    runs-on: [self-hosted, macOS, workbuddy]
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.drift.outputs.verdict }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure clean workspace
        shell: bash
        run: |
          set -e
          git reset --hard
          git clean -fdx

      - name: Run drift guard (manual)
        id: drift
        uses: ./.github/actions/drift-guard
        with:
          mode: manual
          change_class: ${{ inputs.change_class }}
          config_path: .workbuddy/drift-guard.json
          report_json: drift_report.json
          report_md: drift_report.md

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-guard-report-${{ github.run_id }}
          path: |
            drift_report.json
            drift_report.md

      - name: Cleanup runner workspace
        if: always()
        shell: bash
        run: |
          git reset --hard || true
          git clean -fdx || true

  dispatch:
    needs: gate
    if: ${{ needs.gate.outputs.verdict == 'PASS' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch allowlisted workflow
        uses: actions/github-script@v7
        with:
          script: |
            const mapping = {
              "real-approval-trigger": "real-approval-trigger.yml",
              "knowledge-materialization": "knowledge-materialization.yml",
              "approval-polling-writeback": "approval-polling-writeback.yml",
            }
            const workflow_id = mapping["${{ inputs.trigger_target }}"]
            if (!workflow_id) {
              core.setFailed(`unknown trigger_target: ${{ inputs.trigger_target }}`)
              return
            }
            let inputs = {}
            try {
              const raw = ${{ toJSON(inputs.trigger_inputs_json) }}
              inputs = JSON.parse(JSON.parse(raw))
            } catch (err) {
              core.setFailed(`trigger_inputs_json is not valid JSON: ${err}`)
              return
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id,
              ref: context.ref,
              inputs,
            })
