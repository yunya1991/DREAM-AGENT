name: reusable-drift-guard

on:
  workflow_call:
    inputs:
      change_class:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      config_path:
        required: false
        type: string
        default: ".workbuddy/drift-guard.json"
      comment_on_pr_block:
        required: false
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Checkout DREAM-AGENT source at workflow ref
        uses: actions/checkout@v4
        with:
          repository: yunya1991/DREAM-AGENT
          ref: ${{ inputs.source_ref }}
          path: .workbuddy/_dream_agent_source
          fetch-depth: 1
          clean: true

      - name: Ensure clean workspace
        shell: bash
        run: |
          set -e
          git reset --hard
          git clean -fdx
          git fetch origin main --depth=1

      - name: Run drift guard
        id: drift
        uses: ./.workbuddy/_dream_agent_source/.github/actions/drift-guard
        with:
          mode: ${{ github.event_name == 'workflow_dispatch' && 'manual' || github.event_name }}
          change_class: ${{ inputs.change_class }}
          config_path: ${{ inputs.config_path }}
          base_sha: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
          head_sha: ${{ github.event_name == 'pull_request' && 'HEAD' || '' }}
          report_json: drift_report.json
          report_md: drift_report.md

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-guard-report-${{ github.run_id }}
          path: |
            drift_report.json
            drift_report.md

      - name: Comment drift report (PR block)
        if: ${{ inputs.comment_on_pr_block && failure() && github.event_name == 'pull_request' && hashFiles('drift_report.md') != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("drift_report.md", "utf8");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
