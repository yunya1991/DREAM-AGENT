name: Feishu Approval Smoke

on:
  workflow_dispatch:
    inputs:
      approval_code:
        description: "Approval definition code"
        required: true
        default: "6DE5C07A-5FDC-44D0-9110-8B74AB0837B6"
        type: string
      applicant_open_id:
        description: "Applicant open_id"
        required: true
        default: "ou_e4188db561199adccd1ba20636f9930a"
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, macOS, workbuddy]
    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v4

      - name: Mint lark tenant access token
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = json.dumps(
              {
                  "app_id": os.environ["LARK_APP_ID"],
                  "app_secret": os.environ["LARK_APP_SECRET"],
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              result = json.loads(response.read().decode("utf-8"))
          if result.get("code") != 0 or not result.get("tenant_access_token"):
              raise SystemExit(json.dumps(result, ensure_ascii=False))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"LARK_TENANT_ACCESS_TOKEN={result['tenant_access_token']}\n")
          PY

      - name: Fetch approval definition and create instance
        env:
          APPROVAL_CODE: ${{ inputs.approval_code }}
          APPLICANT_OPEN_ID: ${{ inputs.applicant_open_id }}
          LARK_TENANT_ACCESS_TOKEN: ${{ env.LARK_TENANT_ACCESS_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          token = os.environ["LARK_TENANT_ACCESS_TOKEN"]
          approval_code = os.environ["APPROVAL_CODE"]
          applicant_open_id = os.environ["APPLICANT_OPEN_ID"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json; charset=utf-8",
          }

          def request_json(url, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  payload = exc.read().decode("utf-8", errors="replace")
                  try:
                      return {"http_status": exc.code, "error": json.loads(payload)}
                  except json.JSONDecodeError:
                      return {"http_status": exc.code, "error_text": payload}

          definition = request_json(
              f"https://open.feishu.cn/open-apis/approval/v4/approvals/{approval_code}"
          )
          Path("approval_definition.json").write_text(
              json.dumps(definition, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          create_body = {
              "approval_code": approval_code,
              "user_id": applicant_open_id,
              "instance_external_id": f"smoke-{os.environ['GITHUB_RUN_ID']}",
              "form": [],
            }
          created = request_json(
              "https://open.feishu.cn/open-apis/approval/v4/instances",
              method="POST",
              body=create_body,
          )
          Path("approval_instance_create.json").write_text(
              json.dumps(created, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print("Definition response saved to approval_definition.json")
          print("Create response saved to approval_instance_create.json")
          print(json.dumps(created, ensure_ascii=False))
          if created.get("code") not in (None, 0):
              raise SystemExit(1)
          PY

      - name: Upload approval smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feishu-approval-smoke-${{ github.run_id }}
          path: |
            approval_definition.json
            approval_instance_create.json
